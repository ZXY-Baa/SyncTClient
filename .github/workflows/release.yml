name: release

# Legt bei einem Etikett v1.2.3 ein Installationspaket an und stellt es als
# Freigabe ein.
#
# Die Fassung kommt aus dem Etikett, nicht aus der Projektdatei; beide muessen
# aber uebereinstimmen, sonst bricht der Lauf ab. Ein Etikett, das auf einen
# anderen Stand zeigt als das Paket, waere spaeter nicht mehr zu entwirren.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fassung aus dem Etikett
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Etikett '$tag' hat nicht die Form v1.2.3."
          }
          $version = $Matches[1]

          $props = (Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          if ($props -ne $version) {
            throw "Etikett sagt $version, Directory.Build.props sagt $props. Beides muss gleich sein."
          }

          "FASSUNG=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Fassung: $version"

      - name: Uebersetzen
        run: dotnet build SyncTClient.slnx -c Release --nologo

      # Wie im Bau-Lauf: SelfContained muss als globale Eigenschaft kommen,
      # sonst bricht synctmount die Veroeffentlichung mit NETSDK1150 ab.
      - name: Veroeffentlichen
        run: dotnet publish src/SyncTClient.Gui/SyncTClient.Gui.csproj -c Release -p:PublishProfile=FolderProfile -p:SelfContained=true --nologo

      # Signiert wird nur, wenn ein Zertifikat hinterlegt ist. Ohne die beiden
      # Geheimnisse laeuft der Lauf wie bisher: unsigniert, und Windows warnt
      # beim Start. Wie das Zertifikat hereinkommt, steht in docs/signing.md.
      #
      # Signiert wird vor dem Verpacken: was im Paket liegt, muss schon
      # signiert sein, sonst traegt die ausgelieferte Datei eine Signatur, die
      # zum Inhalt nicht passt.
      - name: Programm signieren
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          PFX_PASSWORT: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Host "Kein Zertifikat hinterlegt (SIGN_PFX_BASE64) - unsigniert."
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP 'signatur.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match \\x64\\ } |
                      Sort-Object FullName -Descending |
                      Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe nicht gefunden." }
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Nur was gestartet wird. Jede Bibliothek zu signieren kostet Minuten
          # und bewirkt nichts: geprueft wird die Datei, die Windows ausfuehrt.
          foreach ($datei in @('BIN\SyncTClient.exe', 'BIN\synctexplorer.dll')) {
            if (-not (Test-Path $datei)) { Write-Host "$datei fehlt - uebersprungen."; continue }

            & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $datei
            if ($LASTEXITCODE -ne 0) { throw "Signieren von $datei brach mit $LASTEXITCODE ab." }
          }

          Remove-Item $pfx -Force
          "Programm signiert."

      - name: Inno Setup installieren
        run: choco install innosetup -y --no-progress

      # Der Pfad haengt an der Fassung (6 liegt unter "Program Files (x86)",
      # 7 unter "Program Files"). Gesucht statt geraten.
      - name: ISCC finden
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe nicht gefunden." }
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $iscc.FullName /? | Select-Object -First 1

      - name: Installationspaket bauen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $env:ISCC "/DFassung=$env:FASSUNG" "/DQuelle=$PWD\BIN" "/DZiel=$PWD\dist" "$PWD\setup\SyncTClient.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC brach mit $LASTEXITCODE ab." }

          $paket = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $paket) { throw "Kein Installationspaket entstanden." }
          "PAKET=$($paket.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Nach dem Verpacken und vor der Pruefsumme. Andersherum passte der
      # veroeffentlichte Wert nicht zu dem, was heruntergeladen wird.
      - name: Installationspaket signieren
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          PFX_PASSWORT: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Host "Kein Zertifikat hinterlegt - unsigniert."
            exit 0
          }
          if (-not $env:SIGNTOOL) { throw "SIGNTOOL fehlt; der Signierschritt lief nicht." }

          $pfx = Join-Path $env:RUNNER_TEMP 'signatur.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))

          & $env:SIGNTOOL sign /f $pfx /p $env:PFX_PASSWORT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $env:PAKET
          if ($LASTEXITCODE -ne 0) { throw "Signieren des Pakets brach mit $LASTEXITCODE ab." }

          Remove-Item $pfx -Force
          "Paket signiert."

      - name: Pruefsumme
        shell: pwsh
        run: |
          $paket = Get-Item $env:PAKET

          # Pruefsumme neben das Paket. Sie belegt nicht, wer es gebaut hat --
          # aber sie belegt, dass die Datei unterwegs unveraendert blieb, und
          # gehoert zu genau diesem Lauf.
          $summe = (Get-FileHash $paket.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $summendatei = Join-Path $paket.DirectoryName ($paket.Name + ".sha256")
          "$summe  $($paket.Name)" | Out-File -FilePath $summendatei -Encoding utf8

          "SUMME=$summendatei" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Paket: $($paket.Name), {0:N1} MB" -f ($paket.Length / 1MB)
          "SHA-256: $summe"

      - name: Freigabe anlegen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Hinweise aus dem Changelog, wie beim Veroeffentlichen von Hand.
          # Fehlt der Abschnitt, nimmt gh die Betreffe der Commits.
          $text = [System.IO.File]::ReadAllText((Resolve-Path CHANGELOG.md), [System.Text.Encoding]::UTF8)
          $muster = '(?ms)^## ' + [regex]::Escape($env:FASSUNG) + ' .*?\r?\n(.*?)(?=^## |\z)'
          $treffer = [regex]::Match($text, $muster)

          # Ein Etikett laesst sich neu setzen -- dann steht die Freigabe noch
          # aus dem vorigen Lauf, und "create" bricht ab. Sie wird deshalb
          # vorher entfernt; das Etikett selbst bleibt.
          & gh release delete "v$env:FASSUNG" --yes 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Vorhandene Freigabe fuer v$env:FASSUNG entfernt." }

          $anhang = @($env:PAKET)
          if ($env:SUMME -and (Test-Path $env:SUMME)) { $anhang += $env:SUMME }

          $argumente = @('release', 'create', "v$env:FASSUNG") + $anhang + @('--title', "SyncTClient $env:FASSUNG")
          if ($treffer.Success -and $treffer.Groups[1].Value.Trim()) {
            $hinweise = Join-Path $env:RUNNER_TEMP 'hinweise.md'
            [System.IO.File]::WriteAllText($hinweise, $treffer.Groups[1].Value.Trim(), (New-Object System.Text.UTF8Encoding($false)))
            $argumente += @('--notes-file', $hinweise)
          } else {
            $argumente += '--generate-notes'
          }

          & gh @argumente
          if ($LASTEXITCODE -ne 0) { throw "gh release create brach mit $LASTEXITCODE ab." }
